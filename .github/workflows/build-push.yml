name: Build and push CloudRun image

# 在 GitHub 上构建 linux/amd64 镜像并推送到腾讯云 TCR，替代云托管在线构建。
# 需要在本仓库 Settings → Secrets and variables → Actions 中配置：
#   Secrets:   TCR_USERNAME（腾讯云账号 ID）、TCR_PASSWORD（TCR 个人版登录密码）
#   Variables: TCR_REGISTRY=ccr.ccs.tencentyun.com、TCR_NAMESPACE=你的命名空间、TCR_REPO=openpronounce

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'cloudrun_patch_server.py'
      - 'cloudrun_entrypoint.sh'
      - '.github/workflows/build-push.yml'

env:
  IMAGE: ${{ vars.TCR_REGISTRY }}/${{ vars.TCR_NAMESPACE }}/${{ vars.TCR_REPO }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          # Runner 在境外，pip/apt 覆盖为官方源避免绕路；
          # 但 HF_ENDPOINT 会以 ENV 烘进镜像、供运行时下载模型用——运行实例在国内，
          # 必须保持 hf-mirror.com（构建期已不再下载模型，此值只影响运行时）。
          build-args: |
            OPENPRONOUNCE_REF=main
            DEBIAN_MIRROR=deb.debian.org
            PIP_INDEX=https://pypi.org/simple
            PIP_TRUSTED=pypi.org
            HF_ENDPOINT_URL=https://hf-mirror.com
